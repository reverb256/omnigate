<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">omnigate icon</title>
  <desc id="logo-desc">omnigate geometric mark — two layers fusing into one</desc>
  <defs>
    <linearGradient id="omni-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5" />
      <stop offset="100%" style="stop-color:#7C3AED" />
    </linearGradient>
    <style>
      .icon-back { fill: url(#omni-grad); }
      .icon-accent { fill: #10B981; }
      .icon-arrow { fill: #FFFFFF; opacity: 0.85; }
    </style>
  </defs>

  <g id="logo-symbol">
    <!-- Bottom layer (old system) -->
    <path class="icon-back" d="M8,40 L30,31 L30,42 L8,51 Z" opacity="0.55" />
    <!-- Top layer (new system) -->
    <path class="icon-back" d="M20,26 L42,17 L42,28 L20,37 Z" />
    <!-- Fused seam / mount point -->
    <path class="icon-accent" d="M14,37 L36,28 L36,31 L14,40 Z" />
    <!-- Forward arrow -->
    <path class="icon-arrow" d="M6,47 L6,44 L12,45.5 L6,47 Z" />
  </g>
</svg>
