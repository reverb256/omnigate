# Fleet SSH baseline — identical on zephyr, nexus, forge, sentry.
# Source of truth: omnigate repo, fleet-ssh/sshd/12-fleet-sshd.conf
# Deploy to: /etc/ssh/sshd_config.d/12-fleet-sshd.conf on every host.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
AllowUsers j_kro
